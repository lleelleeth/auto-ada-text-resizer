<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 15px; background: #f0f0f0; }
    h3 { margin: 0 0 10px; color: #333; }
    .info { font-size: 14px; color: #666; margin-bottom: 15px; }
    .button-group { margin: 10px 0; }
    .label { font-size: 12px; color: #888; margin-bottom: 5px; font-weight: bold; }
    button { 
      padding: 10px 20px; font-size: 14px; margin: 5px; 
      background: #0077FF; color: white; border: none; border-radius: 6px; cursor: pointer; 
    }
    button:hover { background: #0055CC; }
    button.secondary { background: #28a745; }
    button.secondary:hover { background: #218838; }
    #result { margin-top: 10px; color: #333; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Auto ADA Text Resizer (v1.0)</h3>
  <p class="info">WCAG AA compliance: Fix texts <16px to 16px+</p>
  <div class="button-group">
    <div class="label">Select text layers and click</div>
    <button id="selected" class="secondary">Fix Selected Texts</button>
  </div>
  <div class="button-group">
    <div class="label">Select a frame and click</div>
    <button id="scan">Scan & Fix Frame</button>
  </div>
  <div id="result"></div>
  <script>
    document.getElementById('selected').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'fix-selected' } }, '*');
    };
    document.getElementById('scan').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'scan-frame' } }, '*');
    };
    window.onmessage = msg => {
      if (msg.data.pluginMessage && msg.data.pluginMessage.type === 'done') {
        const { fixed, total } = msg.data.pluginMessage;
        document.getElementById('result').innerText = `Fixed: ${fixed} / ${total} texts`;
      }
    };
  </script>
</body>
</html>
